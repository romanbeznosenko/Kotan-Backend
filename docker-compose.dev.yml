version: "3.8"

services:
  minio:
    restart: unless-stopped
    image: quay.io/minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: minio
    command: server /data --console-address ":9001"
    volumes:
      - minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?err}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?err}
    expose:
      - "9000"
    networks:
      - inside
      - kotan-files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  kotan-psql:
    restart: unless-stopped
    image: postgres:17.4-alpine3.21
    container_name: kotan-psql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_DB=${POSTGRES_DB:?err}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-db:/var/lib/postgresql/data
    networks:
      - inside
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kotan-app:
    restart: unless-stopped
    container_name: kotan-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Database Configuration
      - POSTGRES_URL=jdbc:postgresql://kotan-psql:5432/${POSTGRES_DB:?err}
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}

      # JWT Configuration
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?err}

      # Encryption
      - ENCRYPTION_PASSPHRASE=${ENCRYPTION_PASSPHRASE:?err}

      # CORS Configuration
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}

      # Mailgun Configuration
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_CLIENT_DOMAIN=${MAILGUN_CLIENT_DOMAIN}
      - MAILGUN_FROM=${MAILGUN_FROM}
      - MAIL_FRONTEND_URL=${MAIL_FRONTEND_URL}

      # S3/MinIO Configuration
      - STORAGE_S3_BUCKET_NAME=${STORAGE_S3_BUCKET_NAME}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY}
      - STORAGE_S3_ENDPOINT=http://minio:9000

      # ClamAV Configuration
      - CLAMAV_HOST=${CLAMAV_HOST}
      - CLAMAV_PORT=${CLAMAV_PORT}
    expose:
      - "8080"
    depends_on:
      kotan-psql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - inside

volumes:
  postgres-db:
  minio:

networks:
  inside:
    name: kotan-backend_inside
    driver: bridge
  kotan-files:
    external: true
